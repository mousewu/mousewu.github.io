<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a1020">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="shell nav-row">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Xianyue Wu home">
          <span class="brand-mark" aria-hidden="true">XW</span>
          <span>Xianyue Wu</span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/writing/' | relative_url }}">Writing</a>
          <a href="https://github.com/mousewu" rel="me">GitHub</a>
        </nav>
      </div>
    </header>

    <main id="content">{{ content }}</main>

    <footer class="site-footer">
      <div class="shell footer-row">
        <p>Notes on agents that learn, act, and recover.</p>
        <p>© {{ site.time | date: '%Y' }} Xianyue Wu</p>
      </div>
    </footer>
  </body>
</html>
