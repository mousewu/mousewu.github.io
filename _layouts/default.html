<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080d19">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <script>
      (() => {
        const preferred = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        try {
          document.documentElement.dataset.theme = localStorage.getItem('xw-theme') || preferred;
        } catch {
          document.documentElement.dataset.theme = preferred;
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v=4">
    <script src="{{ '/assets/js/theme.js' | relative_url }}?v=3" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="shell nav-row">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Xianyue Wu home">
          <span class="brand-mark" aria-hidden="true">XW</span>
          <span>Xianyue Wu</span>
        </a>
        <div class="header-actions">
          <nav class="site-nav" aria-label="Primary navigation">
            <a href="{{ '/' | relative_url }}">Home</a>
            <a href="{{ '/writing/' | relative_url }}">Writing</a>
            <a href="https://github.com/mousewu" rel="me">GitHub</a>
          </nav>
          <div class="theme-picker" role="group" aria-label="Color theme">
            <button class="theme-option" type="button" data-theme-option="light" aria-label="Use light theme" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3.75"></circle>
                <path d="M12 2.5v2M12 19.5v2M4.5 12h-2M21.5 12h-2M5.28 5.28l1.42 1.42M17.3 17.3l1.42 1.42M18.72 5.28 17.3 6.7M6.7 17.3l-1.42 1.42"></path>
              </svg>
            </button>
            <button class="theme-option" type="button" data-theme-option="dark" aria-label="Use dark theme" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 15.2A8.3 8.3 0 0 1 8.8 4a8.3 8.3 0 1 0 11.2 11.2Z"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main id="content">{{ content }}</main>

    <footer class="site-footer">
      <div class="shell footer-row">
        <p>Notes on agents that learn, act, and recover.</p>
        <div class="footer-meta">
          <a class="footer-email" href="mailto:wuxianyue@gmail.com" aria-label="Email Xianyue Wu at wuxianyue@gmail.com" title="wuxianyue@gmail.com">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m4 7 8 6 8-6"></path>
            </svg>
          </a>
          <p>© {{ site.time | date: '%Y' }} Xianyue Wu</p>
        </div>
      </div>
    </footer>
  </body>
</html>
