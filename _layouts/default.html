<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080d19">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <script>
      (() => {
        const preferred = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        try {
          document.documentElement.dataset.theme = localStorage.getItem('xw-theme') || preferred;
        } catch {
          document.documentElement.dataset.theme = preferred;
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="shell nav-row">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Xianyue Wu home">
          <span class="brand-mark" aria-hidden="true">XW</span>
          <span>Xianyue Wu</span>
        </a>
        <div class="header-actions">
          <nav class="site-nav" aria-label="Primary navigation">
            <a href="{{ '/' | relative_url }}">Home</a>
            <a href="{{ '/writing/' | relative_url }}">Writing</a>
            <a href="https://github.com/mousewu" rel="me">GitHub</a>
          </nav>
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
            </svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path>
            </svg>
            <span data-theme-label>Theme</span>
          </button>
        </div>
      </div>
    </header>

    <main id="content">{{ content }}</main>

    <footer class="site-footer">
      <div class="shell footer-row">
        <p>Notes on agents that learn, act, and recover.</p>
        <p>© {{ site.time | date: '%Y' }} Xianyue Wu</p>
      </div>
    </footer>
  </body>
</html>
